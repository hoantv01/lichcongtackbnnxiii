<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Công Tác Lãnh Đạo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen">
        <div class="login-card">
            <div class="logo-area">
                <i class="fa-solid fa-calendar-days"></i>
                <h2>Lịch Công Tác</h2>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">Tên đăng nhập</label>
                    <input type="text" id="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Đăng nhập</button>
                <div id="login-error" class="error-text" style="display: none;"></div>
            </form>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="app-screen" class="screen" style="display: none;">
        <header class="app-header">
            <div class="header-left">
                <i class="fa-solid fa-calendar-days logo-icon"></i>
                <h1>Lịch công tác</h1>
            </div>
            <div class="header-right">
                <div class="week-navigation">
                    <button id="prev-week-btn" class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
                    <span id="current-week-display">Tuần 15 (10/05 - 16/05)</span>
                    <button id="next-week-btn" class="icon-btn"><i class="fa-solid fa-chevron-right"></i></button>
                    <button id="today-btn" class="btn-secondary btn-small">Hôm nay</button>
                </div>
                <div class="user-info">
                    <span id="user-display-name">Người dùng</span>
                    <span id="user-role-badge" class="badge">Role</span>
                </div>
                <button id="logout-btn" class="btn-outline">Đăng xuất</button>
            </div>
        </header>

        <main class="app-main">
            <div class="toolbar">
                <div class="filters">
                    <select id="leader-filter" class="form-select">
                        <option value="all">Tất cả</option>
                        <!-- Thêm bằng JS -->
                    </select>
                </div>
                <div class="actions">
                    <button id="export-excel-btn" class="btn-secondary" style="display: none; margin-right: 8px; color: #16a34a; border-color: #16a34a;">
                        <i class="fa-solid fa-file-excel"></i> Xuất
                    </button>
                    <button id="add-schedule-btn" class="btn-primary" style="display: none;">
                        <i class="fa-solid fa-plus"></i> Thêm Lịch
                    </button>
                </div>
            </div>

            <!-- Swimlane Calendar -->
            <div class="calendar-container">
                <table class="calendar-matrix" id="calendar-matrix">
                    <thead>
                        <tr id="calendar-header-row">
                            <th class="col-leader">Họ và tên</th>
                            <!-- Các ngày T2 -> CN được thêm bằng JS -->
                        </tr>
                    </thead>
                    <tbody id="calendar-body">
                        <!-- Render bằng JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Add Schedule Modal -->
    <div id="schedule-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Thêm Lịch Công Tác</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body">
                <form id="schedule-form">
                    <input type="hidden" id="schedule-id">
                    <div class="form-row">
                        <div class="input-group">
                            <label for="schedule-leader">Lãnh đạo <span class="required">*</span></label>
                            <select id="schedule-leader" required></select>
                        </div>
                        <div class="input-group">
                            <label for="schedule-date">Ngày <span class="required">*</span></label>
                            <input type="date" id="schedule-date" required>
                        </div>
                    </div>
                    
                    <div class="input-group">
                        <label>Thời gian công tác <span class="required">*</span></label>
                        <div class="radio-group">
                            <label><input type="radio" name="timeOfDay" value="morning" checked> Sáng</label>
                            <label><input type="radio" name="timeOfDay" value="afternoon"> Chiều</label>
                            <label><input type="radio" name="timeOfDay" value="full_day"> Cả ngày</label>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="schedule-content">Nội dung công tác <span class="required">*</span></label>
                        <textarea id="schedule-content" rows="4" required></textarea>
                    </div>

                    <div class="input-group">
                        <label for="schedule-file">File đính kèm (Thư mời, giấy triệu tập...)</label>
                        <input type="file" id="schedule-file" accept="image/*,.pdf,.doc,.docx">
                        <div id="file-upload-status"></div>
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn-secondary cancel-modal">Hủy</button>
                        <button type="submit" class="btn-primary" id="save-schedule-btn">Lưu lịch</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- View Details Modal -->
    <div id="view-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="view-title">Chi tiết lịch công tác</h3>
                <button class="close-modal">&times;</button>
            </div>
            <div class="modal-body" id="view-details-body">
                <!-- Nạp bằng JS -->
            </div>
            <div class="modal-footer" id="view-modal-footer">
                <!-- Nút Xoá/Sửa dành cho văn thư -->
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- App Scripts -->
    <script src="./js/firebase-config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
